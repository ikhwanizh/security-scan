# kscan security scan for GitHub Actions.
#
# Copy to .github/workflows/security-scan.yml in the repo to scan. It pulls a
# pinned kscan image (never builds it), scans, uploads SARIF and fails the job
# on NEW findings at or above fail_on (.security-scan.yml, default high).
#
#   push to main   full scan
#   pull request   only changed files (semgrep, bandit) and the PR's commits
#                  (gitleaks); dependency scanners always scan everything
#
# Exit codes: 0 pass, 1 new findings at/above the threshold, 2 scanner error.
#
# Legacy issues: run `kscan scan . --write-baseline .security-baseline.json`
# once (locally or via the image) and commit the file. Without it every
# finding counts as new.
#
# SARIF upload needs code scanning: free on public repos, GitHub Advanced
# Security on private ones. Without it the upload step is skipped with a
# warning and the job summary plus the report artifact remain.
#
# Optional DefectDojo upload: add repo or org secrets DD_URL (for example
# https://defectdojo.example.com, reachable from the runner) and DD_API_KEY.
# Only full scans of the default branch are uploaded, with reimport-scan and
# close_old_findings. Every scan (pull requests too) also reads triage from
# DefectDojo: findings marked false positive, risk accepted or out of scope
# there no longer fail the job. The DefectDojo server needs
#   DD_DEDUPLICATION_ALGORITHM_PER_PARSER={"kscan Scan (Generic Findings Import)": "unique_id_from_tool"}
# so findings are tracked by kscan fingerprint (see kscan README).
#
# Actions are pinned to commit SHAs; the comment shows the version.

name: security-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read         # pull the kscan image from GHCR
  security-events: write # upload SARIF to code scanning

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  KSCAN_IMAGE: ghcr.io/ikhwanizh/kscan:1.0.0
  # Set to "false" to run full scans on pull requests too.
  KSCAN_PR_DIFF: "true"
  # DefectDojo product type; empty means the repo owner.
  DD_PRODUCT_TYPE: ""

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DD_URL: ${{ secrets.DD_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # diff mode needs the base branch and the PR's commits

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Day stamp for the trivy DB cache
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache trivy vulnerability DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-

      - name: Scan
        id: scan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_PRODUCT: ${{ github.event.repository.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache" kscan-report
          formats=terminal,sarif,json,markdown
          dd=false
          if [ -n "$DD_URL" ] && [ "$EVENT" != "pull_request" ] && [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            dd=true
            formats+=,defectdojo
          fi
          echo "dd=$dd" >> "$GITHUB_OUTPUT"
          args=(scan /src --out /src/kscan-report --format "$formats"
                --baseline /src/.security-baseline.json)
          if [ "$EVENT" = "pull_request" ] && [ "$KSCAN_PR_DIFF" = "true" ]; then
            args+=(--changed-since "origin/$BASE_REF")
          fi
          if [ -n "$DD_URL" ]; then
            args+=(--defectdojo-product "$DD_PRODUCT")
          fi
          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            -e DD_URL -e DD_API_KEY \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$RUNNER_TEMP/trivy-cache:/cache/trivy" \
            "$KSCAN_IMAGE" "${args[@]}"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "kscan exit code: $code"

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('kscan-report/kscan.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: kscan-report/kscan.sarif
          category: kscan

      # Full scans of the default branch only, and only when every scanner
      # ran (exit 0 or 1): close_old_findings would otherwise close findings
      # outside a diff scan, or every finding of a scanner that failed.
      - name: Upload to DefectDojo
        if: always() && steps.scan.outputs.dd == 'true' && (steps.scan.outputs.code == '0' || steps.scan.outputs.code == '1')
        continue-on-error: true
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          PRODUCT_TYPE: ${{ env.DD_PRODUCT_TYPE || github.repository_owner }}
          PRODUCT: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          status=$(curl -sS --retry 3 -o "$RUNNER_TEMP/defectdojo.json" -w '%{http_code}' \
            -X POST "${DD_URL%/}/api/v2/reimport-scan/" \
            -H "Authorization: Token $DD_API_KEY" \
            -F scan_type="Generic Findings Import" \
            -F file=@kscan-report/kscan.defectdojo.json \
            -F product_type_name="$PRODUCT_TYPE" -F product_name="$PRODUCT" \
            -F engagement_name="CI/CD $BRANCH" -F test_title=kscan \
            -F auto_create_context=true -F close_old_findings=true \
            -F deduplication_on_engagement=true -F minimum_severity=Info \
            -F commit_hash="$SHA" -F branch_tag="$BRANCH" -F build_id="$RUN_ID" \
            -F source_code_management_uri="$REPO_URL")
          echo "DefectDojo reimport: HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            head -c 2000 "$RUNNER_TEMP/defectdojo.json"; echo
            exit 1
          fi

      - name: Job summary
        if: always() && hashFiles('kscan-report/kscan.md') != ''
        run: cat kscan-report/kscan.md >> "$GITHUB_STEP_SUMMARY"

      # Reports contain snippets of this repo's code; keep retention short.
      - name: Upload report
        if: always() && hashFiles('kscan-report/kscan.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kscan-report
          path: kscan-report/
          retention-days: 7

      - name: Fail on new findings or scanner errors
        if: always()
        env:
          CODE: ${{ steps.scan.outputs.code }}
        run: exit "${CODE:-2}"

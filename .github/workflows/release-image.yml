# Builds and pushes the kscan image once per release tag (vX.Y.Z).
# Consumer CI only pulls these images; a tag that already exists is never
# rebuilt, so ghcr.io/<owner>/kscan:X.Y.Z always means the same tools.

name: release-image

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make lint test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name and version
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/$owner/kscan" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing version
        env:
          REF: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "::error::$REF already exists; tag a new version instead"
            exit 1
          fi

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Smoke test
        env:
          REF: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
        run: docker run --rm "$REF" doctor

rules:
  - id: kscan-ssrf-unvalidated-host
    languages: [python]
    severity: WARNING
    message: >-
      Outbound connection to a host/URL that is not a literal, and this function
      does not check it against private/loopback/link-local ranges. If the value
      comes from a user (e.g. a saved "external DB connection"), the server can be
      pointed at 127.0.0.1, internal databases or the cloud metadata endpoint
      169.254.169.254 (SSRF). Resolve the host and reject private ranges with the
      `ipaddress` module, at connect time (not only when saving) to stop DNS
      rebinding. Heuristic: confirm the value is user-controlled.
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery"
      confidence: LOW
      source: kscan
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $CLIENT(..., host=$H, ...)
              - pattern-not: $CLIENT(..., host="...", ...)
              # Calls that open a connection, not models/repositories that store one.
              - metavariable-regex:
                  metavariable: $CLIENT
                  regex: (?i)^(.*\.)?(\w*client|connect|create_engine|create_async_engine|create_pool|test_connection\w*)$
              # Hosts from server config are trusted.
              - metavariable-regex:
                  metavariable: $H
                  regex: ^(?!.*\b(settings|config|os\.environ|os\.getenv)\b).*
          - patterns:
              - pattern: $HTTP.$M($URL, ...)
              - pattern-not: $HTTP.$M("...", ...)
              - metavariable-regex:
                  metavariable: $HTTP
                  regex: (?i)^(requests|httpx|aiohttp|session|client|http_client|self\.(client|session|http))$
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(get|post|put|patch|delete|head|request|stream)$
              - metavariable-regex:
                  metavariable: $URL
                  # URL-ish name, but not one built from server config.
                  regex: (?i)^(?!.*(base_url|settings\.|config\.|os\.getenv|os\.environ)).*(url|endpoint|webhook|callback|host).*
      - pattern-inside: |
          def $FUNC(...):
            ...
      # Treat these as "the function validates the destination". Semgrep cannot
      # apply a regex to a negated pattern, so helper names are listed explicitly.
      - pattern-not-inside: |
          def $FUNC(...):
            ...
            <... ipaddress.$IPFN(...) ...>
            ...
      - pattern-not-inside: |
          def $FUNC(...):
            ...
            <... $V.is_private ...>
            ...
      - pattern-not-inside: |
          def $FUNC(...):
            ...
            <... validate_host(...) ...>
            ...
      - pattern-not-inside: |
          def $FUNC(...):
            ...
            <... ensure_public_host(...) ...>
            ...
